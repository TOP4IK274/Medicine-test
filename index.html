<style>
/* Layout: одна узкая колонка «бланк аттестации»: шапка, карточка вопроса, сетка номеров, итоговый протокол */
:root{
  --bg:#f3f5f7; --paper:#ffffff; --ink:#18232e; --muted:#5d6b78; --line:#d9e0e6;
  --accent:#1d5d8f; --accent-soft:#e3eef7; --ok:#1f7a4d; --ok-soft:#e2f3ea; --bad:#b3362f; --bad-soft:#fbe7e5; --warn:#8a5a00; --warn-soft:#fbf0d9;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171d; --paper:#18212a; --ink:#e4eaf0; --muted:#94a3b1; --line:#2a3743;
  --accent:#6fb0e4; --accent-soft:#1c3346; --ok:#5cc58d; --ok-soft:#163327; --bad:#f0857c; --bad-soft:#3a1d1b; --warn:#e3b55a; --warn-soft:#33290f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171d; --paper:#18212a; --ink:#e4eaf0; --muted:#94a3b1; --line:#2a3743;
  --accent:#6fb0e4; --accent-soft:#1c3346; --ok:#5cc58d; --ok-soft:#163327; --bad:#f0857c; --bad-soft:#3a1d1b; --warn:#e3b55a; --warn-soft:#33290f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.6rem;line-height:1.2;margin:0;text-wrap:balance;font-weight:700}
h2{font-size:1.15rem;margin:0;text-wrap:balance}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{color:var(--muted);margin:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 16px}
button:focus-visible,input:focus-visible,label.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sections{display:flex;flex-direction:column;gap:8px}
.sec{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.sec input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.sec span.n{margin-left:auto;color:var(--muted)}
.new{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;vertical-align:1px}
.new.upd{background:var(--accent-soft);color:var(--accent)}
.sec .t{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.field{display:flex;flex-direction:column;gap:8px}
.field>.lbl{font-weight:600}
.toggle{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.toggle input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none}
.toggle small{display:block;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qtext{font-size:1.12rem;font-weight:600;margin:6px 0 14px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
label.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;min-width:0}
label.opt input{position:absolute;opacity:0;pointer-events:none}
label.opt .let{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
label.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
label.opt.sel .let{background:var(--accent);border-color:var(--accent);color:var(--paper)}
label.opt.right{border-color:var(--ok);background:var(--ok-soft)}
label.opt.right .let{background:var(--ok);border-color:var(--ok);color:var(--paper)}
label.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
label.opt.wrong .let{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.feedback{margin-top:12px;padding:10px 12px;border-radius:8px;font-weight:600}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.note{margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:.9rem}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.grid button{padding:6px 0;font-family:var(--f-mono);font-size:.8rem}
.grid button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.grid button.g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grid button.g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.score{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--f-mono);font-size:3rem;line-height:1;font-weight:500}
.verdict{display:inline-block;padding:4px 10px;border-radius:999px;font-weight:600;font-size:.9rem}
.verdict.pass{background:var(--ok-soft);color:var(--ok)}
.verdict.fail{background:var(--bad-soft);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num{text-align:right;white-space:nowrap}
.tblwrap{overflow-x:auto}
.review{display:flex;flex-direction:column;gap:12px}
.ritem{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:14px;background:var(--paper)}
.ritem.ok{border-left-color:var(--ok)}
.ritem .rq{font-weight:600;margin:4px 0 8px}
.ritem .ans{display:flex;gap:8px;align-items:flex-start;margin-top:4px}
.ritem .tag{flex:none;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:4px;margin-top:2px}
.tag.y{background:var(--bad-soft);color:var(--bad)}
.tag.c{background:var(--ok-soft);color:var(--ok)}
.meta{font-size:.8rem;color:var(--muted)}
@media (max-width:480px){.big{font-size:2.4rem}h1{font-size:1.35rem}.panel{padding:16px}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

["Должностным лицам и работникам КФ «UMC» не следует публично выражать своё мнение по вопросам служебной деятельности и деятельности КФ «UMC» в общем, если оно:",["не соответствует основным направлениям деятельности КФ «UMC»","раскрывает конфиденциальную информацию","содержит неэтичные высказывания в адрес должностных лиц КФ «UMC»","всё вышеперечисленное"],3],

["Право информировать родственников о состоянии здоровья пациента имеет:",["только лечащий врач","медицинская сестра, ухаживающая за пациентом","руководитель лечащего врача","все вышеперечисленные"],0],

["Является ли добровольное согласие пациента необходимым предварительным условием для проведения лечебно-диагностических мероприятий?",["да","нет","да, за исключением случаев возникновения угрозы для жизни и здоровья пациента, неспособного по физическому или психическому состоянию адекватно оценить ситуацию","да, за исключением случаев нахождения пациента в состоянии алкогольного или наркотического опьянения"],2],

["Буллинг (травля) — это:",["применение власти над другим человеком посредством негативных действий или поведения, которые компрометируют его или её лично и (или) профессионально","несправедливое или предвзятое обращение с людьми по признаку их расы, возраста, пола, национальности, религиозных и политических убеждений и т. д.","нежеланное поведение, которое имеет целью или следствием ущемление достоинства человека или создание запугивающей, враждебной, унижающей рабочей или учебной среды","получение/дача денег, ценных бумаг, иного имущества или выгод имущественного характера за действия (бездействие)"],0],
["Должностные лица и работники Фонда должны:",["не допускать высказываний личного субъективного мнения относительно других работников и не давать личностные оценки их действиям","не допускать публичных выступлений, высказываний или интервью от имени Фонда без прямо предоставленных полномочий","при исполнении должностных обязанностей руководствоваться интересами Фонда, а не личными отношениями или персональной выгодой","всё вышеперечисленное"],3]
]},
{id:"quality", name:"Программа качества (JCI)", q:[

["Что такое индикатор?",["это количество поданных отчётов об инциденте","это показатель работы, когда можно цифрами измерить выполнение какого-то процесса или измерить результат работы","это показатель выполнения требований СОП","это количество рассмотренных отчётов об инциденте"],1],

["Какие методологии используются для улучшения качества?",["трейсеры (выявление ошибок системы), инциденты, анализ корневых причин, метод непрерывного улучшения работы PDCA","трейсеры, инциденты, методика «5 почему», рекомендации по обследованию и лечению","анализ корневых причин, разбор жалоб, получение информированного согласия","все варианты верны"],0],

      <div class="sections">${DATA.map(s => `
        <label class="sec"><input type="checkbox" id="sec-${s.id}" data-sec="${s.id}" ${cfg.secs.has(s.id) ? "checked" : ""}>
        <span class="t">${esc(s.name)}${s.fresh ? ' <span class="new">новое</span>' : s.upd ? ' <span class="new upd">обновлено</span>' : ""}</span><span class="n mono">${s.q.length}</span></label>`).join("")}
      </div>
      <div class="row"><button id="all">Выбрать все</button><button id="fresh">Только новые</button><button id="none">Снять все</button></div>
    </div>
    <div class="field"><span class="lbl">Сколько вопросов</span>
      <div class="chips">${["20","50","100","all"].map(c => `<button class="chip" data-count="${c}" aria-pressed="${cfg.count===c}">${c==="all" ? "Все ("+total+")" : c}</button>`).join("")}</div>
    </div>
    <div class="field">
      <label class="toggle"><input type="checkbox" id="shufQ" ${cfg.shufQ?"checked":""}><span>Перемешать вопросы</span></label>
      <label class="toggle"><input type="checkbox" id="shufO" ${cfg.shufO?"checked":""}><span>Перемешать варианты ответов<small>Чтобы запоминать ответ, а не букву</small></span></label>
      <label class="toggle"><input type="checkbox" id="instant" ${cfg.instant?"checked":""}><span>Режим обучения<small>Показывать правильный ответ сразу после выбора. Без этой галочки всё как на аттестации: ответы только в конце.</small></span></label>
    </div>
    <div><button class="primary" id="go" ${total ? "" : "disabled"}>Начать тест</button></div>
  </section>`;
  app.querySelectorAll("[data-sec]").forEach(el => el.onchange = () => { el.checked ? cfg.secs.add(el.dataset.sec) : cfg.secs.delete(el.dataset.sec); saveCfg(); startScreen(); });
  $("#all").onclick = () => { DATA.forEach(s => cfg.secs.add(s.id)); saveCfg(); startScreen(); };
  $("#none").onclick = () => { cfg.secs.clear(); saveCfg(); startScreen(); };
  $("#fresh").onclick = () => { cfg.secs = new Set(DATA.filter(s => s.fresh || s.upd).map(s => s.id)); saveCfg(); startScreen(); };
  app.querySelectorAll("[data-count]").forEach(el => el.onclick = () => { cfg.count = el.dataset.count; saveCfg(); startScreen(); });
  ["shufQ","shufO","instant"].forEach(k => $("#"+k).onchange = e => { cfg[k] = e.target.checked; saveCfg(); });
  $("#go").onclick = () => {
    let pool = [];
    DATA.forEach(s => { if (cfg.secs.has(s.id)) s.q.forEach((q, i) => pool.push({ sec: s.id, secName: s.name, n: i + 1, q })); });
    begin(pool);
  };
}

function begin(pool) {
  let items = cfg.shufQ ? shuffle(pool) : pool;
  if (cfg.count !== "all") items = items.slice(0, +cfg.count);
  S = { items: items.map(it => ({ ...it, order: cfg.shufO ? shuffle(it.q[1].map((_, i) => i)) : it.q[1].map((_, i) => i), ans: null })), cur: 0, instant: cfg.instant };
  quiz();
}

function quiz() {
  const it = S.items[S.cur], [text, opts, right, note] = it.q;
  const done = S.items.filter(x => x.ans !== null).length;
  const show = S.instant && it.ans !== null;
  app.innerHTML = `
  <header class="qhead"><div><div class="eyebrow">${esc(it.secName)}</div><h2>Вопрос <span class="mono">${S.cur+1} / ${S.items.length}</span></h2></div>
  <span class="meta mono">отвечено ${done}</span></header>
  <div class="bar"><i style="width:${done / S.items.length * 100}%"></i></div>
  <section class="panel">
    <p class="qtext">${esc(text)}</p>
    <div class="opts" role="radiogroup">${it.order.map((oi, k) => {
      let cls = it.ans === oi ? "sel" : "";
      if (show) cls = oi === right ? "right" : (it.ans === oi ? "wrong" : "");
      return `<label class="opt ${cls}"><input type="radio" name="o" id="o${k}" value="${oi}" ${it.ans===oi?"checked":""} ${show?"disabled":""}><span class="let">${LET[k]}</span><span>${esc(opts[oi])}</span></label>`;
    }).join("")}</div>
    ${show ? `<div class="feedback ${it.ans===right?"ok":"no"}">${it.ans===right ? "Верно" : "Неверно. Правильный ответ: " + LET[it.order.indexOf(right)]}</div>${note?`<div class="note">${esc(note)}</div>`:""}` : ""}
    <div class="nav">
      <button id="prev" ${S.cur===0?"disabled":""}>Назад</button>
      <div class="row">
        ${S.cur < S.items.length - 1 ? `<button class="primary" id="next">Далее</button>` : ""}
        <button id="finish" class="${S.cur===S.items.length-1?"primary":""}">Завершить тест</button>
      </div>
    </div>
  </section>
  <section class="panel"><div class="eyebrow" style="margin-bottom:10px">Переход к вопросу</div>
    <div class="grid">${S.items.map((x, i) => {
      let c = x.ans !== null ? "done" : "";
      if (S.instant && x.ans !== null) c = x.ans === x.q[2] ? "g-ok" : "g-bad";
      return `<button data-go="${i}" class="${c} ${i===S.cur?"cur":""}" aria-label="Вопрос ${i+1}">${i+1}</button>`;
    }).join("")}</div>
  </section>
  <div id="confirm"></div>`;
  app.querySelectorAll('input[name="o"]').forEach(el => el.onchange = () => {
    it.ans = +el.value;
    if (S.instant) quiz();
    else if (S.cur < S.items.length - 1) { S.cur++; quiz(); } else quiz();
  });
  if ($("#next")) $("#next").onclick = () => { S.cur++; quiz(); };
  $("#prev").onclick = () => { S.cur--; quiz(); };
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { S.cur = +b.dataset.go; quiz(); });
  $("#finish").onclick = () => {
    const left = S.items.length - S.items.filter(x => x.ans !== null).length;
    if (!left) return results();
    $("#confirm").innerHTML = `<section class="panel row" style="justify-content:space-between">
      <span>Без ответа: <b class="mono">${left}</b>. Они будут засчитаны как ошибки.</span>
      <div class="row"><button id="back">Вернуться</button><button class="primary" id="sure">Завершить</button></div></section>`;
    $("#back").onclick = () => { const i = S.items.findIndex(x => x.ans === null); S.cur = i; quiz(); };
    $("#sure").onclick = results;
    $("#confirm").scrollIntoView({ block: "nearest" });
  };
  window.scrollTo({ top: 0 });
}

function results(filter) {
  filter = filter || "bad";
  const tot = S.items.length, ok = S.items.filter(x => x.ans === x.q[2]).length, pct = Math.round(ok / tot * 100);
  const by = {};
  S.items.forEach(x => { by[x.secName] = by[x.secName] || [0, 0]; by[x.secName][1]++; if (x.ans === x.q[2]) by[x.secName][0]++; });
  const bad = S.items.map((x, i) => ({ x, i })).filter(o => o.x.ans !== o.x.q[2]);
  const list = filter === "bad" ? bad : S.items.map((x, i) => ({ x, i }));
  app.innerHTML = `
  <header><div class="eyebrow">Результат</div><h1>Тест завершён</h1></header>
  <section class="panel score">
    <div class="big">${pct}%</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div>Правильно <b class="mono">${ok}</b> из <b class="mono">${tot}</b>, ошибок <b class="mono">${tot-ok}</b></div>
      <span class="verdict ${pct>=70?"pass":"fail"}">${pct>=70 ? "Порог 70% пройден" : "Ниже порога 70%"}</span>
    </div>
  </section>
  <section class="panel"><div class="tblwrap"><table>
    <thead><tr><th>Раздел</th><th style="text-align:right">Верно</th><th style="text-align:right">%</th></tr></thead>
    <tbody>${Object.entries(by).map(([n, [a, b]]) => `<tr><td>${esc(n)}</td><td class="num mono">${a} / ${b}</td><td class="num mono">${Math.round(a/b*100)}</td></tr>`).join("")}</tbody>
  </table></div></section>
  <div class="row">
    ${bad.length ? `<button class="primary" id="redo">Повторить ошибки (${bad.length})</button>` : ""}
    <button id="again">Новый тест</button>
  </div>
  <section style="display:flex;flex-direction:column;gap:12px">
    <div class="row" style="justify-content:space-between"><h2>Разбор ответов</h2>
      <div class="chips"><button class="chip" data-f="bad" aria-pressed="${filter==="bad"}">Только ошибки</button><button class="chip" data-f="all" aria-pressed="${filter==="all"}">Все вопросы</button></div>
    </div>
    <div class="review">${list.length ? list.map(({ x, i }) => {
      const [text, opts, right, note] = x.q, good = x.ans === right;
      const L = oi => LET[x.order.indexOf(oi)];
      return `<article class="ritem ${good?"ok":""}">
        <div class="meta">№ ${i+1} · ${esc(x.secName)}, вопрос ${x.n} в исходном тесте</div>
        <p class="rq">${esc(text)}</p>
        ${good ? `<div class="ans"><span class="tag c">Верно</span><span>${L(right)}. ${esc(opts[right])}</span></div>` :
        `<div class="ans"><span class="tag y">Ваш ответ</span><span>${x.ans===null ? "нет ответа" : L(x.ans) + ". " + esc(opts[x.ans])}</span></div>
         <div class="ans"><span class="tag c">Правильно</span><span>${L(right)}. ${esc(opts[right])}</span></div>`}
        ${note ? `<div class="note">${esc(note)}</div>` : ""}
      </article>`;
    }).join("") : `<p class="sub">Ошибок нет. Отличный результат.</p>`}</div>
  </section>`;
  if ($("#redo")) $("#redo").onclick = () => begin(bad.map(o => ({ sec: o.x.sec, secName: o.x.secName, n: o.x.n, q: o.x.q })));
  $("#again").onclick = startScreen;
  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => results(b.dataset.f));
  if (!filter || filter === "bad") window.scrollTo({ top: 0 });
}

startScreen();
</script>

</body></html>
